# Cloudflare Worker for QR Studio dynamic links.
# Nothing here is deployed until you run `npm run deploy` (see README.md).
name = "qr-studio-links"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# When you have a domain on Cloudflare, uncomment and set it, then also set
# PUBLIC_BASE below to the same address.
# routes = [{ pattern = "go.example.com", custom_domain = true }]

[vars]
# Where the QR Studio site lives (used for "/" and links on error pages)
SITE_URL = "https://faarisaahmed.github.io/qr-maker/"
# Sites allowed to call the API from a browser (comma separated)
ALLOWED_ORIGINS = "https://faarisaahmed.github.io"
# Base of the short links printed into QR codes. Defaults to the Worker URL.
# PUBLIC_BASE = "https://go.example.com"
CREATE_LIMIT_PER_HOUR = "30"
SCAN_RETENTION_DAYS = "395"
# Optional comma-separated domains that can never be used as destinations
BLOCKED_HOSTS = ""

# Secrets — set with `npx wrangler secret put NAME`, never put them here:
#   DATABASE_URL       Neon connection string (required)
#   IP_SALT            any long random string (required)
#   ADMIN_TOKEN        long random string to unlock /admin endpoints (optional)
#   SAFE_BROWSING_KEY  Google Safe Browsing API key (recommended)

# Daily maintenance: prune old scan logs + re-check links with Safe Browsing
[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
